# Step 2: action-policy rules. Deterministic: names, no LLM.
forwards:
  - name: shop
    address: "http://shop:9090/mcp"
    namespace: shop

action_policy:
  rules:
    - id: deny-customer-data
      description: The shop assistant has no business reading customer emails
      effect: deny
      selectors:
        namespace: shop
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: listCustomers }
      reason_code: customer_data_denied
      message: This assistant may not list customers.

    - id: deny-price-changes
      effect: deny
      selectors:
        namespace: shop
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: updatePrice }
      reason_code: price_change_denied
      message: This assistant may not change prices.

governance:
  namespaces:
    shop:
      # Everything that no rule matches is allowed (the evaluator comes in step 3).
      no_match: allow

# Step 2: the moderation agent may not use the six tools it does not need. Only getReview,
# setReviewRating, approveReview and hideReview stay. No LLM involved, the rules are deterministic.
#
# This is a deny list: a tool that is added to the shop later is allowed until someone adds a rule.
# Default deny (no_match: deny) did not work in 0.3.1 with plain allow rules: an action-policy allow does
# not skip the evaluator layer, and the evaluator layer has no match for these tools.
forwards:
  - name: shop
    address: "http://shop:9090/mcp"
    namespace: moderation

action_policy:
  rules:
    - id: deny-searchProducts
      description: Product search is not part of moderation
      effect: deny
      selectors:
        namespace: moderation
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: searchProducts }
      reason_code: not_a_moderation_tool
      message: The moderation agent may not use searchProducts.

    - id: deny-getReviews
      description: Reading all reviews of a product is not part of moderation
      effect: deny
      selectors:
        namespace: moderation
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: getReviews }
      reason_code: not_a_moderation_tool
      message: The moderation agent may not use getReviews.

    - id: deny-getOrder
      description: Orders are not part of moderation
      effect: deny
      selectors:
        namespace: moderation
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: getOrder }
      reason_code: not_a_moderation_tool
      message: The moderation agent may not use getOrder.

    - id: deny-refundOrder
      description: A moderator never refunds anything
      effect: deny
      selectors:
        namespace: moderation
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: refundOrder }
      reason_code: not_a_moderation_tool
      message: The moderation agent may not use refundOrder.

    - id: deny-listCustomers
      description: A moderator has no business with customer emails
      effect: deny
      selectors:
        namespace: moderation
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: listCustomers }
      reason_code: not_a_moderation_tool
      message: The moderation agent may not use listCustomers.

    - id: deny-updatePrice
      description: A moderator never changes prices
      effect: deny
      selectors:
        namespace: moderation
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: updatePrice }
      reason_code: not_a_moderation_tool
      message: The moderation agent may not use updatePrice.

governance:
  namespaces:
    moderation:
      no_match: allow

audit:
  max_records: 1000

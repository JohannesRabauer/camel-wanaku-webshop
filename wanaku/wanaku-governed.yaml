# Step 3: action-policy rules (deterministic) plus an LLM evaluator that limits refunds.
# Needs OPENAI_API_KEY in the container environment (docker run -e OPENAI_API_KEY ...).
forwards:
  - name: shop
    address: "http://host.docker.internal:9090/mcp"
    namespace: shop

action_policy:
  rules:
    - id: deny-customer-data
      description: The shop assistant has no business reading customer emails
      effect: deny
      selectors:
        namespace: shop
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: listCustomers }
      reason_code: customer_data_denied
      message: This assistant may not list customers.

    - id: deny-price-changes
      effect: deny
      selectors:
        namespace: shop
        operation: tools/call
        target_type: tool
        target_name: { matcher: exact, value: updatePrice }
      reason_code: price_change_denied
      message: This assistant may not change prices.

governance:
  namespaces:
    shop:
      # Everything that no rule matches is allowed.
      no_match: allow

llm_connections:
  - name: gate-llm
    model: gpt-4o-mini
    url: "https://api.openai.com/v1"
    api_key: "env:OPENAI_API_KEY"

evaluators:
  - name: refund-gate
    trigger:
      method: tools/call
      namespace: shop
    engine:
      type: llm
      operation: classify
      connection: gate-llm
      prompt: |
        You check tool calls of a webshop assistant. Answer only with JSON:
        {"level": "green" | "red", "reason": "<short reason>"}.
        Answer "red" if the tool is refundOrder and the amount is more than 25 EUR.
        Answer "green" for every other call, including refunds of 25 EUR or less.
    processor:
      path: /data/evaluators/safety_review_action.wasm

audit:
  max_records: 1000

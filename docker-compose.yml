# The whole demo with one command:  docker compose up --build
#
#   shop       the webshop: storefront, REST API, Camel ai-tool routes, MCP server    http://localhost:9090
#   moderator  the AI agent that checks every new review (rating, language, approve/hide)
#   wanaku     the governed proxy between moderator and shop                          http://localhost:8081/moderation/mcp
#   agent      a command line assistant on the same tools, started on demand (see README), not by "up"
#
# Which Wanaku rules apply: WANAKU_CONFIG=wanaku-open.yaml | wanaku-policy.yaml (default)
# Which tools the moderator can reach: MODERATOR_MCP_URL, through Wanaku (default) or straight to the shop

services:
  shop:
    build: ./shop
    environment:
      SHOP_MODERATOR_URL: http://moderator:8082
      # Short DNS cache, so the shop finds the moderator again after its container was recreated.
      JAVA_TOOL_OPTIONS: -Dsun.net.inetaddr.ttl=2
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/api/products"]
      interval: 5s
      timeout: 3s
      retries: 20

  wanaku:
    image: quay.io/wanaku/wanaku-server:0.3.1
    depends_on:
      shop:
        condition: service_healthy
    ports:
      - "${WANAKU_MCP_PORT:-8081}:8081"      # MCP endpoint, one URL per namespace
      - "${WANAKU_ADMIN_PORT:-18080}:8080"   # management and audit API (18080, because 8080 is often taken)
    volumes:
      - wanaku-data:/data/registry
      - ./wanaku/${WANAKU_CONFIG:-wanaku-policy.yaml}:/etc/wanaku/wanaku.yaml:ro

  moderator:
    build: ./agent
    depends_on:
      shop:
        condition: service_healthy
      wanaku:
        condition: service_started
    environment:
      AGENT_MODE: moderator
      # Through Wanaku by default. Unprotected, straight to the shop: MODERATOR_MCP_URL=http://shop:9090/mcp
      MCP_URL: ${MODERATOR_MCP_URL:-http://wanaku:8081/moderation/mcp}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-openai}
      AGENT_MODEL: ${AGENT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  agent:
    build: ./agent
    profiles: ["agent"]
    depends_on:
      - shop
      - wanaku
    environment:
      MCP_URL: ${MCP_URL:-http://wanaku:8081/moderation/mcp}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-openai}
      AGENT_MODEL: ${AGENT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  wanaku-data:

# The shop's REST API and the Camel MCP server share this port.
quarkus.http.port=9090

# Token the shop's REST API demands (admin access). The Camel routes send it to the API.
shop.admin-token=shop-admin-secret

# Expose every ai-tool tagged "shop" as an MCP tool (endpoint: /mcp).
quarkus.camel.mcp-server.tags=shop

# Needed by the Streamable HTTP MCP endpoint.
quarkus.http.cors.enabled=true

# Where new reviews are sent for moderation (the agent service). In Docker Compose: http://moderator:8082
shop.moderator-url=${SHOP_MODERATOR_URL:http://localhost:8082}
